name: Enterprise Financial RAG CI

on:
  push:
    branches: [ main, portfolio-build ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Linting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check src/ tests/

  test:
    name: Unit, Regression & API Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage & Regression Guard
        run: |
          pytest tests/ --cov=src --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Upload Executive Evaluation Report
        uses: actions/upload-artifact@v4
        with:
          name: executive-evaluation-report
          path: |
            results/executive_evaluation_report.md
            results/summary_metrics.json
            results/beir_retrieval_benchmark_results.json
          retention-days: 30

  docker-build:
    name: Multi-Stage Docker Image Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image (Smoke Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: fiqa-financial-rag:latest
