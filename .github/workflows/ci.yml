name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Automated Tests & Quality
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: "test_mock_key_for_ci"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Code Quality Linter
        run: python -m ruff check src/ tests/ app.py

      - name: Run Core Unit Test Suite
        run: |
          pytest tests/test_schemas.py tests/test_cache.py tests/test_metrics.py tests/test_guardrails.py tests/test_query_expansion.py tests/test_retrieval_and_chunking.py -v
