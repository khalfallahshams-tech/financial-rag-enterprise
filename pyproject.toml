[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-rag-enterprise"
version = "1.0.0"
description = "Production Two-Stage Hybrid Financial Intelligence RAG Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "E402", "W293"]  # line length, sys.path inserts, and whitespace in blank docstrings

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "venv/*", "scratch/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
